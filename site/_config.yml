# Built by .github/workflows/pages.yml from what .github/scripts/site.mjs stages:
# this folder, and the docs pages made from the repository's Markdown.
title: Tranchant
description: Settle a code review, one finding at a time. Claude makes each fix.
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  toc_levels: 2..3
# site.mjs already points the links at the pages, relatively so the site works
# at any address: nothing else touches them.
relative_links:
  enabled: false
# Annotant, the sibling every page links to, in the header and the footer.
sibling:
  url: https://annotant.keveun.net/
  tagline: Comment on your running app, Claude makes the change.
# PostHog counts the visits (_layouts/default.html) once `key` is set, in the
# "Sites" project shared with Annotant's website, told apart by $host. The key
# is public by design; without one, or on a preview, the pages load nothing.
# Keep on in its settings "Cookieless tracking" (or PostHog drops every event),
# "Discard client IP data" (no IP is stored) and "Filter out internal and test
# users" with `internal` is not true (the owner's visits).
posthog:
  key: phc_qBYkHwroRva6PuupZSB6n2XyW7BiYRF3g2LFiAS2eBQg
  host: https://us.i.posthog.com
